name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
      - name: Git identity
        run: |
          git config --global user.email "ci@track.test"
          git config --global user.name "track-ci"
      - name: Install jj
        run: cargo install --locked jj-cli
      - name: Verify jj
        run: jj --version
      - name: Check formatting
        run: cargo fmt -- --check
      - name: Clippy
        run: cargo clippy -- -D warnings
      - name: Run tests
        run: cargo test --verbose
      - name: Build CLI
        run: cargo build
      - name: Scenario harness
        run: python3 scripts/track-sim.py
      - name: Rustdoc
        run: cargo doc --no-deps --document-private-items
