name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release --verbose
      - name: Create archive
        run: |
          tar -czf track-linux-amd64.tar.gz -C target/release track
      - name: Release notes from CHANGELOG.md
        run: python3 scripts/changelog_for_tag.py "${GITHUB_REF_NAME}" > release-notes.md
      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          files: track-linux-amd64.tar.gz
