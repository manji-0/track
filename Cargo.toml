[package]
name = "task-track"
version = "0.7.0"
edition = "2024"
rust-version = "1.88"
authors = ["manji0"]
description = "Personal work-context manager for humans and coding agents (CLI + Web UI, XDG SQLite)"
license = "MIT"
repository = "https://github.com/manji0/track"
keywords = ["cli", "task-management", "jj", "context", "productivity"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"

[lib]
name = "track"

[[bin]]
name = "track"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4.6"
rusqlite = { version = "0.40", features = ["bundled"] }
directories = "6.0"
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }
prettytable-rs = "0.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
regex = "1.13"
html-escape = "0.2"
ammonia = "4.1"

# Web server
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
tower-http = { version = "0.7", features = ["fs"] }

# Templating
minijinja = { version = "2.24", features = ["loader"] }

# Real-time updates (SSE)
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"

# Browser opening
open = "5.4"

[dev-dependencies]
tempfile = "3.27.0"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

# Release binary: smaller, faster CLI (LTO + single codegen unit + strip)
[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
