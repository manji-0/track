<div id="description-section" hx-get="/api/card/description" hx-trigger="sse:description"
    hx-target="#description-section" hx-swap="outerHTML" hx-sync="this:replace" hx-disinherit="hx-trigger">
    <div class="sec-head">
        <span class="sec-label">DESCRIPTION</span>
        <button class="sec-action" onclick="toggleDescEdit()">✏️ Edit</button>
    </div>
    {% if task.description %}
    <div class="description" id="desc-display">{{ task.description }}</div>
    {% else %}
    <div class="description text-muted" id="desc-display">No description set.</div>
    {% endif %}
    <form id="desc-edit-form" style="display: none;" hx-post="/api/description"
        hx-trigger="submit, keydown[ctrlKey&&key=='Enter'] from:textarea"
        hx-disabled-elt="find button[type='submit']">
        <textarea name="description" id="desc-textarea" rows="4"
            placeholder="Enter task description… (Ctrl+Enter to save)">{{ task.description or '' }}</textarea>
        <div class="form-actions">
            <button type="submit" class="btn-primary">Save</button>
            <button type="button" class="btn-secondary" onclick="toggleDescEdit()">Cancel</button>
        </div>
    </form>
</div>
